[package]
name = "uneven-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lib]
name = "uneven_core"
crate-type = ["rlib"]

[dependencies]
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
catfive = { version = "0.2.0", features = ["serde"] }
postcard = { version = "1.1", features = ["use-std"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
notify = "8.2.1"
similar = "3.2.1"
tracing = "0.1.44"
once_cell = "1.21.4"
futures = "0.3.34"
calamine = "0.37"
csv = "1.4"
pdf-extract = "0.12.1"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite"] }
mongodb = "3.9.1"
redis = { version = "1.8.1", features = ["tokio-comp", "aio"] }
regex = "1.13.1"
rayon = "1.12"
walkdir = "2.5"
ignore = "0.4.34"
zstd = "0.14.3"
sha2 = "0.11.1"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29", features = ["v4", "serde"] }
git2 = { version = "0.21", features = ["vendored-libgit2", "vendored-openssl"] }
toml = "1.1.8"
libc = "0.2.191"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
patchcraft = "0.1.0"
llmcraft = "0.1.0"
shieldcraft = "0.1.0"
contextcraft = "0.1.0"
ragcraft = "0.1.0"
infercraft = "0.1.0"

# LLM and embeddings
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
tokenizers = { version = "0.23.2", features = ["http"], optional = true }
usearch = { version = "2.26.6", optional = true }
memmap2 = { version = "0.9", optional = true }

reqwest = { version = "0.13.5", features = ["json", "stream"] }
obfstr = "0.4.6"
rust_xlsxwriter = "0.102.0"
base64 = "0.23.1"
rustls = "0.23.46"
tokio-rustls = "0.26.6"
x509-parser = "0.18.1"
rustls-pemfile = "2.2"


[dev-dependencies]
tempfile = "3"
dotenvy = "0.15"

[features]
default = ["llm", "vector-store", "pentester"]
llm        = ["candle-core", "candle-nn", "candle-transformers", "tokenizers", "memmap2"]
cuda       = ["llm", "candle-core/cuda",       "candle-nn/cuda",       "candle-transformers/cuda"]
metal      = ["llm", "candle-core/metal",      "candle-nn/metal",      "candle-transformers/metal"]
mkl        = ["llm", "candle-core/mkl",        "candle-nn/mkl",        "candle-transformers/mkl"]
accelerate = ["llm", "candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]
vector-store = ["usearch"]
pentester    = []

[[example]]
name = "simple"
path = "examples/simple.rs"

[[example]]
name = "test_analyze_live"
path = "examples/test_analyze_live.rs"

[[example]]
name = "test_classify_live"
path = "examples/test_classify_live.rs"

[[example]]
name = "test_think_phase1_live"
path = "examples/test_think_phase1_live.rs"

[[example]]
name = "test_think_phase2_critic_live"
path = "examples/test_think_phase2_critic_live.rs"

[[example]]
name = "test_think_phase3_integrity_live"
path = "examples/test_think_phase3_integrity_live.rs"

[[example]]
name = "test_think_phase4_synthesis_live"
path = "examples/test_think_phase4_synthesis_live.rs"


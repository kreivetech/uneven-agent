[package]
name = "uneven-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lib]
name = "uneven_core"
crate-type = ["rlib"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
thiserror = "2"
anyhow = "1"
notify = "6"
similar = "3"
tracing = "0.1"
once_cell = "1"
futures = "0.3"
calamine = "0.26"
csv = "1.3"
pdf-extract = "0.7"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "mysql", "sqlite"] }
mongodb = "3.1"
redis = { version = "0.27", features = ["tokio-comp"] }
regex = "1.10"
rayon = "1.10"
walkdir = "2.5"
ignore = "0.4"
zstd = "0.13"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
git2 = { version = "0.20", features = ["vendored-libgit2", "vendored-openssl"] }
toml = "0.8"
libc = "0.2"
zip = { version = "2.2.0", default-features = false, features = ["deflate"] }

# LLM and embeddings
candle-core = { version = "0.10", optional = true }
candle-nn = { version = "0.10", optional = true }
candle-transformers = { version = "0.10", optional = true }
tokenizers = { version = "0.22", features = ["http"], optional = true }
usearch = { version = "2", optional = true }

reqwest = { version = "0.13", features = ["json", "stream"] }
obfstr = "0.4"
rust_xlsxwriter = "0.94.0"
base64 = "0.22"
rustls = "0.23"
tokio-rustls = "0.26"
x509-parser = "0.16"
rustls-pemfile = "2.1"


[dev-dependencies]
tempfile = "3"

[features]
default = ["llm", "vector-store", "pentester"]
llm        = ["candle-core", "candle-nn", "candle-transformers", "tokenizers"]
cuda       = ["llm", "candle-core/cuda",       "candle-nn/cuda",       "candle-transformers/cuda"]
metal      = ["llm", "candle-core/metal",      "candle-nn/metal",      "candle-transformers/metal"]
mkl        = ["llm", "candle-core/mkl",        "candle-nn/mkl",        "candle-transformers/mkl"]
accelerate = ["llm", "candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]
vector-store = ["usearch"]
pentester    = []

[[example]]
name = "simple"
path = "examples/simple.rs"


[profile.release]
lto = true
opt-level = 3
strip = true

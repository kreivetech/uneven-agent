[package]
name = "uneven-ui"
version = "0.2.2"
description = "Uneven IDE - Preemptive security audits, surgical diffs, and safe analytics"
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[package.metadata.bundle]
name = "Uneven IDE"
identifier = "dev.uneven.ide"
icon = [
    "icons/32x32.png",
    "icons/128x128.png",
    "icons/256x256.png",
    "icons/icon.ico",
]
version = "0.2.2"
copyright = "Copyright (c) 2026 Kreive Tech"
category = "Development"
short_description = "IDE with preemptive security audits, surgical diffs, and safe analytics"
long_description = "Uneven IDE is a high-velocity development environment engineered for building scalable and secure software with pre-production security audits, surgical visual diffs, and non-destructive data analysis."

[package.metadata.bundle.deb]
depends = ["libwebkit2gtk-4.1-0", "libssl3", "libayatana-appindicator3-1"]

[dependencies]
dioxus = { version = "0.7.10", features = ["router", "desktop"] }
uneven-core = { path = "../uneven-core" }
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
catfive = { version = "0.2.0", features = ["serde"] }
uuid = { version = "1.29", features = ["v4"] }
similar = "3.2.1"
rfd = "0.15.4"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]

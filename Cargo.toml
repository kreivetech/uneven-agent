[workspace]
members = ["crates/uneven-core", "crates/uneven-cli", "crates/uneven-ui"]
resolver = "2"

[workspace.package]
version = "2.5.0"
edition = "2024"
authors = ["Kreive Tech <contact@kreive.com.br>"]
license = "BSL-1.1"
homepage = "https://uneven.dev"
repository = "https://github.com/kreivesler/uneven"

[profile.release]
lto = true
opt-level = 3
strip = true

[profile.dev.package.candle-core]
opt-level = 3

[profile.dev.package.candle-transformers]
opt-level = 3

[profile.dev.package.candle-nn]
opt-level = 3

[profile.dev.package.gemm]
opt-level = 3

[profile.dev.package.gemm-f32]
opt-level = 3

[profile.dev.package.gemm-common]
opt-level = 3


